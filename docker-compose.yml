version: "3.9"
services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./init/postgres:/docker-entrypoint-initdb.d

  mariadb:
    image: mariadb:10.5
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mariadbdata:/var/lib/mysql
      - ./init/mariadb:/docker-entrypoint-initdb.d

  mariadb-master:
    image: mariadb:10.5
    container_name: mariadb-master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_MASTER}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER_MASTER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD_MASTER}
    ports:
      - "3308:3306"
    volumes:
      - ./init/mariadb:/docker-entrypoint-initdb.d
      - ./config/my-master.cnf:/etc/mysql/conf.d/my.cnf
      - mariadbmasterdata:/var/lib/mysql 

  mariadb-slave1:
    image: mariadb:10.5
    container_name: mariadb-slave1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_SLAVE1}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER_SLAVE1}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD_SLAVE1}
      MYSQL_REPLICATION_USER: ${MYSQL_REPL_USER}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPL_PASSWORD}
    ports:
      - "3309:3306"
    depends_on:
      - mariadb-master
    volumes:
      - ./config/my-slave.cnf:/etc/mysql/conf.d/my.cnf
      - mariadbslave1data:/var/lib/mysql 

  mariadb-slave2:
    image: mariadb:10.5
    container_name: mariadb-slave2
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_SLAVE2}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER_SLAVE2}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD_SLAVE2}
      MYSQL_REPLICATION_USER: ${MYSQL_REPL_USER}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPL_PASSWORD}
    ports:
      - "3310:3306"
    depends_on:
      - mariadb-master
    volumes:
      - ./config/my-slave.cnf:/etc/mysql/conf.d/my.cnf
      - mariadbslave2data:/var/lib/mysql

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "27016:27017"
    volumes:
      - mongodata:/data/db
      - ./init/mongodb:/docker-entrypoint-initdb.d

  configsvr:
    image: mongo:6.0
    container_name: configsvr
    command: ["mongod", "--configsvr", "--replSet", "configReplSet", "--port", "27019", "--bind_ip_all"]
    ports:
      - "27019:27019"
    volumes:
      - ./data/configdb:/data/configdb

  shard1:
    image: mongo:6.0
    container_name: shard1
    command: ["mongod", "--shardsvr", "--replSet", "shard1ReplSet", "--port", "27018", "--bind_ip_all"]
    ports:
      - "27018:27018"
    volumes:
      - ./data/shard1:/data/db

  shard2:
    image: mongo:6.0
    container_name: shard2
    command: ["mongod", "--shardsvr", "--replSet", "shard2ReplSet", "--port", "27017", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - ./data/shard2:/data/db

  mongos:
    image: mongo:6.0
    container_name: mongos
    depends_on:
      - configsvr
      - shard1
      - shard2
    command: >
      mongos --configdb configReplSet/configsvr:27019 --bind_ip_all --port 27020
    ports:
      - "27020:27020"

  cache:
    image: redis:6.2-alpine
    restart: always
    ports:
      - '6379:6379'
    command: redis-server --save 20 1 --loglevel warning --requirepass root123
    volumes: 
      - cache:/data
      

volumes:
  pgdata:
  mariadbdata:
  mariadbmasterdata:
  mariadbslave1data:
  mariadbslave2data:
  mongodata:
  cache:
    driver: local
